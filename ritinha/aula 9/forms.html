<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag - Forms</title>
</head>
<body>
    <h2 style="background-color: rgb(182, 172, 239);">Cadastro do aluno</h2>

    <form action="#">

        <label for="campo_nome">Nome:</label>
        <input type="text" name="nome_usuario" id="campo_nome">
        <br> <br>

        <label for="email_email">Email:</label>
        <input type="email" name="email" id="email_email">
        <br> <br>

        <label for="contato">Contato:</label>
        <input type="number" name="Telefone" id="contato">

        <br> <br>

        <input type="submit" value="enviar" style="background-color:  rgb(182, 172, 239);">
    </form>

</body>
</html>
